<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Forttiva Service - Gestão e Operações</title>

    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#092318" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Forttiva Service" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Ícones -->
    <link rel="icon" type="image/png" href="/assets/aistudio/image_b058c63c.png" />
    <link rel="apple-touch-icon" href="/assets/aistudio/image_b058c63c.png" />

    <!-- Fonte -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />

    <style>
      html, body {
        margin: 0;
        padding: 0;
        background-color: #092318;
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
      }
      .initial-loader {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        height: 100dvh;
        background-color: #092318;
        color: #fff;
        text-align: center;
        position: relative;
        overflow: hidden;
      }
      .loader-overlay {
        position: absolute;
        inset: 0;
        background: radial-gradient(circle at center, rgba(82, 121, 59, 0.25) 0%, #092318 80%);
        z-index: 0;
        pointer-events: none;
      }
      .loader-spinner {
        position: relative;
        z-index: 2;
        width: 38px;
        height: 38px;
        border: 3px solid rgba(255, 255, 255, 0.1);
        border-top-color: #76994e;
        border-radius: 50%;
        animation: spin 0.9s cubic-bezier(0.5, 0.1, 0.4, 0.9) infinite;
        margin-bottom: 2rem;
      }
      .loader-content {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
        position: relative;
        z-index: 2;
      }
      .loader-title {
        font-weight: 900;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        font-size: 1.75rem;
        margin: 0;
        line-height: 1;
        color: #fff;
      }
      .loader-subtitle {
        font-size: 0.75rem;
        color: #a2b882;
        margin: 0.35rem 0 0.5rem;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 0.3em;
      }
      .loader-tagline {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        margin-top: 0.25rem;
      }
      .loader-tagline span:first-child {
        display: inline-block;
        width: 14px;
        height: 1.5px;
        background-color: #52793b;
        border-radius: 999px;
      }
      .loader-tagline span:last-child {
        font-size: 0.65rem;
        color: rgba(255, 255, 255, 0.7);
        font-style: italic;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>

    <link rel="stylesheet" href="/index.css" />
  </head>

  <body>
    <div id="root">
      <div class="initial-loader">
        <div class="loader-overlay"></div>
        <div class="loader-spinner"></div>
        <div class="loader-content">
          <div style="background-color: #ffffff; border-radius: 20px; padding: 12px 20px; display: inline-flex; align-items: center; justify-content: center; box-shadow: 0 10px 30px rgba(0,0,0,0.35); margin-bottom: 1.25rem;">
            <img src="/assets/aistudio/image_d343a7bb.png" alt="Forttiva Serviços" style="height: 40px; width: auto; object-fit: contain;" />
          </div>
          <div class="loader-tagline">
            <span></span>
            <span>Força e eficiência em campo.</span>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
